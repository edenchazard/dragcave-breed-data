version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: saturday
      time: '08:00'
      timezone: Europe/London
    labels:
      - dependencies
      - npm
    groups:
      oxc:
        patterns:
          - oxfmt
          - oxlint

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: saturday
      time: '08:00'
      timezone: Europe/London
    labels:
      - dependencies
      - actions
